name: Bug Report
description: Report a bug in the firmware
title: "[BUG] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a bug! Please provide as much detail as possible."
  
  - type: input
    id: board
    attributes:
      label: ESP32 Board Model
      description: "e.g., ESP32-DEVKIT-V4, ESP32-S3, etc."
    validations:
      required: true
  
  - type: input
    id: framework
    attributes:
      label: Framework/Build System
      description: "e.g., ESP-IDF v5.1, Arduino, PlatformIO"
    validations:
      required: true
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Clear and concise description of the bug"
    validations:
      required: true
  
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: "Steps to reproduce the bug"
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "What should happen"
    validations:
      required: true
  
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: "What actually happens"
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Logs/Error Messages
      description: "Relevant error messages or log output"
      render: shell
  
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: "Any additional information"
